<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon-image.png" type="image/png">
    <title>Community Chat | Snowdrop United</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Work+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <script type="module" src="firebase-config.js"></script>
    <script type="module">
        import { loadComponents } from './components.js';
        document.addEventListener('DOMContentLoaded', loadComponents);
    </script>
</head>
<body>

    <nav class="navbar" id="main-navbar"></nav>

    <section class="page-header" style="min-height: 30vh;">
        <div class="hero-overlay">
            <div class="container">
                <h1>Community Chat</h1>
                <p>Connect with other volunteers and organizers.</p>
            </div>
        </div>
    </section>

    <div class="container chat-section">
        <div class="chat-window" id="messages-container">
            <p style="text-align: center; color: #999; margin-top: 20px;">Loading messages...</p>
        </div>
        
        <form id="message-form" class="message-input-container">
            <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
            <button type="submit" class="btn-primary">Send</button>
        </form>
    </div>

    <script src="app.js"></script>

    <footer class="footer" id="main-footer"></footer>
</body>
</html>
